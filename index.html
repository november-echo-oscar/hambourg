<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Hambourg Explorer - Le Grand Tour 2 Jours</title>
    
    <!-- Lien vers le Manifest PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        #map { height: 100%; width: 100%; z-index: 1; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .custom-pin {
            width: 32px; height: 32px; background: #2563eb; border: 3px solid white;
            border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 800; font-size: 12px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
        }
        .custom-pin div { transform: rotate(45deg); }

        .alt-pin {
            width: 32px; height: 32px; background: #d97706; border: 3px solid white;
            border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 800; font-size: 12px; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
            transition: all 0.3s ease;
        }
        .alt-pin div { transform: rotate(45deg); }
        
        .animate-popup { 
            animation: popUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        @keyframes popUp { 
          from { transform: translateY(20px) scale(0.95); opacity: 0; } 
          to { transform: translateY(0) scale(1); opacity: 1; } 
        }

        .animate-slide-up { 
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        @keyframes slideUp { 
          from { transform: translateY(100%); } 
          to { transform: translateY(0); } 
        }

        /* Toast notifications */
        .toast {
            animation: toastIn 0.3s ease-out forwards;
        }
        @keyframes toastIn {
            from { transform: translateY(100px) translateX(-50%); opacity: 0; }
            to { transform: translateY(0) translateX(-50%); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 overflow-hidden text-slate-900 fixed inset-0 w-screen h-[100dvh]">

    <div class="flex flex-col w-full h-full">
        <!-- Header -->
        <header class="bg-white border-b px-4 md:px-6 py-3 md:py-4 flex items-center justify-between z-30 shadow-sm shrink-0 pt-[calc(0.75rem+env(safe-area-inset-top))]">
            <div class="flex items-center gap-3 md:gap-4">
                <div class="bg-blue-600 p-2 md:p-2.5 rounded-xl md:rounded-2xl text-white shadow-lg shadow-blue-100">
                    <i data-lucide="anchor" class="w-5 h-5 md:w-6 md:h-6"></i>
                </div>
                <div>
                    <h1 class="text-base md:text-xl font-black tracking-tight text-blue-900 uppercase italic leading-none">Hamburg Explorer</h1>
                    <p id="mode-indicator" class="text-[9px] md:text-[10px] font-bold text-blue-500 uppercase tracking-widest mt-1">Mode Visionnage</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <a 
                  href="https://www.hvv.de/" 
                  target="_blank"
                  class="px-3 py-2 md:px-4 md:py-2.5 bg-emerald-600 text-white rounded-xl text-[9px] md:text-[10px] font-black uppercase tracking-widest transition-all flex items-center gap-1.5 hover:bg-emerald-700 shadow-sm"
                  title="Application HVV Transports en commun"
                >
                  <i data-lucide="bus" class="w-4 h-4"></i>
                  <span class="hidden sm:inline">HVV App</span>
                </a>
                <button

                >
                  <i data-lucide="settings-2" class="w-4 h-4"></i>
                  <span id="btn-text" class="hidden sm:inline">Gérer l'itinéraire</span>
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
            
            <!-- Sidebar Wrapper (Desktop Collapsible) -->

                                <i data-lucide="map-pin" class="text-blue-600 w-4 h-4"></i> Circuit Hamburg 2 Jours
                            </span>
                            <span id="step-count-badge" class="text-[10px] font-bold text-slate-400 bg-white px-2 py-1 rounded-lg border border-slate-200">
                                ... étapes
                            </span>
                        </div>

                        <!-- Sélecteur de Journée -->
                        <div class="bg-slate-200 p-1 rounded-2xl flex gap-1">
                            <button 
                              id="btn-day-1" 
                              onclick="switchDay(1)"

                            >
                              <i data-lucide="calendar" class="w-3.5 h-3.5"></i> Jour 1 (Sud / Port)
                            </button>
                            <button 
                              id="btn-day-2"

                              <i data-lucide="sun" class="w-3.5 h-3.5"></i> Jour 2 (Centre / Jardins)
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar pb-24 md:pb-4" id="itinerary-list">

                    </div>

                    <div id="add-step-container" class="hidden p-4 border-t bg-white shrink-0">

                            onclick="createNewStep()"

                        >
                            <i data-lucide="plus-circle" class="w-4 h-4"></i> Ajouter une étape au Jour <span id="current-day-label">1</span>
                        </button>
                    </div>
                </aside>
                
                <button 
                  id="sidebar-toggle-btn"
                  onclick="toggleSidebar()"
                  class="hidden md:flex absolute top-1/2 -translate-y-1/2 -right-5 w-5 h-12 bg-white border border-l-0 border-slate-200 rounded-r-xl shadow-md z-[1001] items-center justify-center text-slate-400 hover:text-blue-600 transition-all active:scale-95 cursor-pointer"
                  title="Masquer/Afficher le menu"

                  <i id="toggle-sidebar-icon" data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Map Area -->
            <main id="map-container" class="hidden md:flex flex-1 relative h-full">
                <div id="map"></div>
                
                <!-- Bouton flottant de recentrage -->
                <div class="absolute top-4 left-4 z-[999] flex flex-col gap-2">
                    <button 
                      id="recenter-map-btn"
                      onclick="fitItinerary()"
                      class="bg-white text-slate-700 p-3 rounded-2xl shadow-lg border border-slate-100 hover:bg-slate-50 transition-all active:scale-95 flex items-center justify-center"
                      title="Voir tout l'itinéraire"

                      <i data-lucide="route" class="w-5 h-5 text-blue-600"></i>
                    </button>
                </div>
                
                <!-- Bottom sheet click outside overlay on mobile (Uniquement pour le mode Édition) -->

                  onclick="closeAllPanels()"

                <!-- PANNEAU VISIONNAGE DISCRET (Bulle Verticale Compacte proche de la barre du bas) -->

                    <!-- Header avec Titre -->
                    <div class="px-4 py-3 flex items-center justify-between bg-white border-b border-slate-100 shrink-0">
                        <h2 id="view-title" class="text-[15px] font-black leading-tight tracking-tight text-slate-800 line-clamp-1 pr-2"></h2>
                        <button onclick="closeViewer()" class="p-1.5 bg-slate-100 text-slate-500 rounded-full hover:bg-slate-200 transition-all shrink-0 active:scale-90">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <!-- Scrollable Content -->
                    <div class="p-4 overflow-y-auto no-scrollbar flex flex-col gap-3">
                        
                        <!-- Image & Badges (Bannière compacte) -->
                        <div class="relative w-full h-24 rounded-xl overflow-hidden shrink-0 shadow-sm">
                            <img id="view-img" src="" class="w-full h-full object-cover" alt="Hambourg">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                            <div class="absolute bottom-2 left-2 right-2 flex flex-wrap gap-1.5">
                                <span id="view-time" class="bg-blue-600 text-white text-[9px] px-2 py-0.5 rounded-md font-black uppercase tracking-wider shadow-sm"></span>
                                <span id="view-dur" class="bg-white/90 backdrop-blur-md text-slate-800 text-[9px] px-2 py-0.5 rounded-md font-black uppercase tracking-wider shadow-sm"></span>
                                <span id="view-walk-dist" class="bg-emerald-500/90 backdrop-blur-md text-white text-[9px] px-2 py-0.5 rounded-md font-black uppercase tracking-wider flex items-center gap-1 shadow-sm">
                                    <i data-lucide="footprints" class="w-2.5 h-2.5"></i> <span id="view-walk-text"></span>
                                </span>
                            </div>
                        </div>

                        <!-- Onglets spécifiques pour le parking de départ (Jour 1 / Étape 1) -->
                        <div id="day1-parking-tabs" class="hidden bg-slate-100 p-1 rounded-xl flex gap-1 shrink-0">
                            <button onclick="switchDay1ParkingOption('parking')" id="tab-d1-park" class="flex-1 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider transition-all bg-white text-blue-600 shadow-sm">Option 1</button>
                            <button onclick="switchDay1ParkingOption('hotel')" id="tab-d1-hotel" class="flex-1 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider transition-all text-slate-500 hover:text-slate-800">Option 2</button>
                        </div>

                        <!-- Onglets spécifiques pour le parking de départ Jour 2 (Étape 1) -->
                        <div id="day2-parking-tabs" class="hidden bg-slate-100 p-1 rounded-xl flex gap-1 shrink-0">
                            <button onclick="switchDay2ParkingOption('parking')" id="tab-d2-park" class="flex-1 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider transition-all bg-white text-emerald-600 shadow-sm">Option 1</button>
                            <button onclick="switchDay2ParkingOption('hotel')" id="tab-d2-hotel" class="flex-1 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider transition-all text-slate-500 hover:text-slate-800">Option 2</button>
                        </div>

                        <!-- Onglets spécifiques pour le midi (Étape Déjeuner Jour 1) -->
                        <div id="lunch-options-tabs" class="hidden bg-slate-100 p-1 rounded-xl flex gap-1 shrink-0">
                            <button onclick="switchLunchOption('main')" id="tab-lunch-main" class="flex-1 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider transition-all bg-white text-blue-600 shadow-sm">Principal</button>
                            <button onclick="switchLunchOption('alt1')" id="tab-lunch-alt1" class="flex-1 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider transition-all text-slate-500 hover:text-slate-800">Repli 1</button>
                            <button onclick="switchLunchOption('alt2')" id="tab-lunch-alt2" class="flex-1 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider transition-all text-slate-500 hover:text-slate-800">Repli 2</button>
                        </div>

                        <!-- Onglets spécifiques pour le dîner du soir (Étape Soirée Jour 1) -->
                        <div id="dinner-options-tabs" class="hidden bg-slate-100 p-1 rounded-xl flex gap-1 shrink-0">
                            <button onclick="switchDinnerOption('main')" id="tab-dinner-main" class="flex-1 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider transition-all bg-white text-blue-600 shadow-sm">Principal</button>
                            <button onclick="switchDinnerOption('alt1')" id="tab-dinner-alt1" class="flex-1 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider transition-all text-slate-500 hover:text-slate-800">Repli 1</button>
                            <button onclick="switchDinnerOption('alt2')" id="tab-dinner-alt2" class="flex-1 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider transition-all text-slate-500 hover:text-slate-800">Repli 2</button>
                        </div>

                        <!-- Description et Info Historique -->
                        <div class="flex flex-col gap-1.5">
                            <p id="view-desc" class="text-slate-700 text-[13px] font-medium leading-relaxed"></p>
                        </div>

                        <div class="bg-slate-50 px-3 py-2 rounded-xl border border-slate-100">
                            <h4 class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-0.5 flex items-center gap-1.5">
                                <i data-lucide="history" class="w-3 h-3"></i> Le saviez-vous ?
                            </h4>
                            <p id="view-hist" class="text-slate-500 text-xs italic leading-relaxed"></p>
                        </div>
                        
                        <!-- Boutons d'Action -->
                        <div class="flex gap-2 pt-1">
                            <button 
                              id="view-gps-btn"
                              class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-black text-[11px] uppercase tracking-widest shadow-md shadow-blue-100 flex items-center justify-center gap-2 active:scale-95 transition-all"
                            >
                              <i data-lucide="navigation" class="w-4 h-4"></i> Y Aller
                            </button>
                            <a 
                              id="view-wiki-link"
                              href="#" 
                              target="_blank" 
                              class="bg-slate-100 text-slate-600 px-4 flex items-center justify-center rounded-xl hover:bg-slate-200 transition-all active:scale-95"
                              title="Plus d'infos sur Wikipédia"
                            >
                              <i data-lucide="info" class="w-5 h-5"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- PANNEAU ÉDITION (Configuration de l'étape) -->
                <div id="edit-panel" class="hidden absolute md:top-4 md:right-4 bottom-0 left-0 right-0 w-full md:w-[400px] bg-white rounded-t-[32px] md:rounded-[32px] shadow-2xl z-[1000] overflow-hidden flex flex-col border-2 border-blue-500 animate-slide-up max-h-[85vh]">
                    <div class="p-5 border-b bg-blue-50 flex justify-between items-center shrink-0">
                        <h2 class="font-black text-blue-900 uppercase text-xs tracking-widest">Configuration de l'étape</h2>
                        <button 
                          onclick="closeEdit()" 
                          class="text-blue-500 hover:text-blue-700 p-1 rounded-full active:scale-90"
                        >
                          <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div class="p-6 space-y-4 overflow-y-auto no-scrollbar pb-[calc(1.5rem+env(safe-area-inset-bottom))]">
                        <form id="edit-form" class="space-y-4">
                            <input type="hidden" id="e-id">
                            <div>
                                <label class="text-[9px] font-black uppercase text-slate-400 mb-1 block tracking-wider">Nom du lieu</label>
                                <input 
                                  type="text" 
                                  id="e-name"
                                  class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 font-bold text-sm outline-none focus:border-blue-500 transition-all"
                                  required
                                />
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-[9px] font-black uppercase text-slate-400 mb-1 block tracking-wider">Heure</label>
                                    <input 
                                      type="text" 
                                      id="e-time"
                                      class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 font-bold text-sm outline-none focus:border-blue-500 transition-all"
                                    />
                                </div>
                                <div>
                                    <label class="text-[9px] font-black uppercase text-slate-400 mb-1 block tracking-wider">Durée</label>
                                    <input 
                                      type="text" 
                                      id="e-dur"
                                      class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 font-bold text-sm outline-none focus:border-blue-500 transition-all"
                                    />
                                  </div>
                            </div>
                            <div>
                                <label class="text-[9px] font-black uppercase text-slate-400 mb-1 block tracking-wider">Description</label>
                                <textarea 
                                  id="e-desc"
                                  class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 font-bold text-sm outline-none focus:border-blue-500 transition-all" 
                                  rows="3"
                                ></textarea>
                            </div>
                            <div class="flex gap-3 pt-3">
                                <button 
                                  type="button" 
                                  onclick="deleteStep()"
                                  class="p-3.5 bg-red-50 text-red-500 rounded-xl hover:bg-red-100 transition-all active:scale-95 flex items-center justify-center"
                                >
                                  <i data-lucide="trash-2" class="w-5 h-5"></i>
                                </button>
                                <button 
                                  type="submit" 
                                  class="flex-1 bg-blue-600 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all active:scale-95"
                                >
                                  Enregistrer
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>

        <!-- Barre d'onglets mobile (uniquement visible sur mobile) -->
        <div class="md:hidden bg-white border-t flex justify-around pt-2 shrink-0 z-40 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] pb-[calc(10px+env(safe-area-inset-bottom))]">
            <button 
              id="mobile-tab-list-btn"
              onclick="switchMobileTab('list')" 
              class="flex flex-col items-center gap-1 py-1.5 px-4 rounded-xl transition-all text-blue-600 font-extrabold scale-105"
            >
              <i data-lucide="list" class="w-5 h-5"></i>
              <span class="text-[9px] uppercase tracking-wider">Étapes</span>
            </button>
            <button 
              id="mobile-tab-map-btn"
              onclick="switchMobileTab('map')" 
              class="flex flex-col items-center gap-1 py-1.5 px-4 rounded-xl transition-all text-slate-400 font-bold"
            >
              <i data-lucide="map" class="w-5 h-5"></i>
              <span class="text-[9px] uppercase tracking-wider">Carte</span>
            </button>
        </div>
    </div>

    <!-- Toast Popup System -->
    <div id="toast-container" class="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Leaflet Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Main Logic -->
    <script>
        const DEFAULT_IMG = "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=800";
        
        // --- JOUR 1 : Options de parcours selon le parking ---
        const DEFAULT_ITINERARY_DAY1_PARKING = [

            {

            { id: "d1-4", day: 1, order: 4, name: "4. Elbphilharmonie Plaza", coords: [53.5413, 9.9841], time: "13:15", dur: "50m", desc: "Plateforme panoramique sur le toit-terrasse surplombant le port.", hist: "Achevé en 2016.", wiki: "https://fr.wikipedia.org/wiki/Philharmonie_de_l%27Elbe", img: DEFAULT_IMG },
            { id: "d1-5", day: 1, order: 5, name: "5. Feuerschiff & Cap San Diego", coords: [53.5435, 9.9775], time: "14:15", dur: "35m", desc: "Navires historiques amarrés le long des pontons Überseebrücke.", hist: "Balade maritime au fil de l'eau.", wiki: "https://de.wikipedia.org/wiki/Feuerschiff_LV_13", img: DEFAULT_IMG },

        const STORAGE_KEY_D1 = "hamburg_explorer_d1_v20";

        function getCurrentItinerary() {
            return activeDay === 1 ? ITINERARY_DAY1 : ITINERARY_DAY2;
        }

        function setCurrentItinerary(data) {
            if (activeDay === 1) {
                ITINERARY_DAY1 = data;
            } else {
                ITINERARY_DAY2 = data;
            }
        }

        function calculateDistanceMeters(coords1, coords2) {
            if (!coords1 || !coords2) return 0;
            const R = 6371000;
            const lat1 = coords1[0] * Math.PI / 180;
            const lat2 = coords2[0] * Math.PI / 180;
            const deltaLat = (coords2[0] - coords1[0]) * Math.PI / 180;
            const deltaLon = (coords2[1] - coords1[1]) * Math.PI / 180;

            const a = Math.sin(deltaLat/2) * Math.sin(deltaLat/2) +
                      Math.cos(lat1) * Math.cos(lat2) *
                      Math.sin(deltaLon/2) * Math.sin(deltaLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return Math.round(R * c * 1.25);
        }

        function getWalkingInfo(index) {
            const list = getCurrentItinerary();
            if (index === 0) {
                return { distanceText: "Départ", durationText: "", fullText: "Départ" };
            }

            const current = list[index];
            const previous = list[index - 1];

            if (!current || !previous) return { distanceText: "", durationText: "", fullText: "" };

            const meters = calculateDistanceMeters(previous.coords, current.coords);
            const minutes = Math.max(1, Math.round(meters / 75));

            let distStr = "";
            if (meters >= 1000) {
                distStr = (meters / 1000).toFixed(1) + " km";
            } else {
                distStr = meters + " m";
            }

            const durStr = `~${minutes} min`;
            return {
                distanceText: distStr,
                durationText: durStr,
                fullText: `${distStr} (${durStr})`
            };
        }

            } else {

            }

            const savedMode2 = localStorage.getItem(STORAGE_KEY_D2_MODE);
            if (savedMode2) day2ParkingMode = savedMode2;

            if (day2ParkingMode === 'hotel') {
                ITINERARY_DAY2 = [...DEFAULT_ITINERARY_DAY2_HOTEL];
            } else {
                ITINERARY_DAY2 = [...DEFAULT_ITINERARY_DAY2_PARKING];
            }

            renderItineraryList();

        }

            activeDay = dayNumber;
            
            const btn1 = document.getElementById('btn-day-1');
            const btn2 = document.getElementById('btn-day-2');
            const currentDayLabel = document.getElementById('current-day-label');

            if (dayNumber === 1) {

                btn1.className = "flex-1 py-2 rounded-xl text-[10px] font-black uppercase tracking-wider transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5";
                if (currentDayLabel) currentDayLabel.innerText = "2";
            }

            closeAllPanels();
            renderItineraryList();
            renderMap();
            fitItinerary();

        function renderMap() {
            let isFirstInit = false;
            if (!map) {
                map = L.map('map', { zoomControl: false }).setView([53.548, 9.985], 13);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    attribution: '© OpenStreetMap contributors © CartoDB',
                    maxZoom: 19
                }).addTo(map);

                isFirstInit = true;
            }

            markers.forEach(m => map.removeLayer(m));
            markers = [];
            if (polyline) map.removeLayer(polyline);
            if (activeAlternativeMarker) {
                map.removeLayer(activeAlternativeMarker);
                activeAlternativeMarker = null;
            }

            const currentList = getCurrentItinerary();
            const routeCoords = currentList.map(p => p.coords).filter(c => c && c.length === 2);
            if (routeCoords.length > 0) {
                polyline = L.polyline(routeCoords, { color: activeDay === 1 ? '#2563eb' : '#059669', weight: 4, opacity: 0.6 }).addTo(map);
            }

            currentList.forEach((place, index) => {
                const icon = L.divIcon({
                    className: '',
                    html: `<div class="custom-pin ${isEditMode ? 'opacity-50' : ''}" style="background: ${activeDay === 1 ? '#2563eb' : '#059669'}"><div>${index + 1}</div></div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 32]
                });
                const m = L.marker(place.coords, { icon }).addTo(map).on('click', () => {
                    if (isEditMode) {
                        openEdit(place);
                    } else {
                        openViewer(place);
                    }
                });
                markers.push(m);
            });

            if (isFirstInit) {
                // Fermer le panneau si on clique sur la carte (seulement si le panneau n'est pas caché)
                map.on('click', () => {
                    const viewerPanel = document.getElementById('viewer-panel');
                    if (!viewerPanel.classList.contains('hidden')) {
                        closeViewer();
                    }
                });
                
                if (routeCoords.length > 0) {
                    fitItinerary();
                }
            }
        }

        // Met à jour dynamiquement l'itinéraire et affiche le point unique de l'alternative choisie
        function updateRouteWithAlternative(newCoords) {
            const currentList = getCurrentItinerary();
            if (currentList.length > 0) {
                const routeCoords = currentList.map(p => p.coords).filter(c => c && c.length === 2);
                
                const panelTitle = document.getElementById('view-title').innerText;
                let activeIndex = -1;
                if (panelTitle.includes("Midi") || panelTitle.includes("Déjeuner")) activeIndex = 2; // Etape 3 (index 2)
                else if (panelTitle.includes("Soir") || panelTitle.includes("Dîner")) activeIndex = 10; // Etape 11 (index 10)
                
                if (activeIndex !== -1 && routeCoords[activeIndex]) {
                    routeCoords[activeIndex] = newCoords;
                }

                if (polyline) map.removeLayer(polyline);
                polyline = L.polyline(routeCoords, { color: activeDay === 1 ? '#2563eb' : '#059669', weight: 4, opacity: 0.6 }).addTo(map);

                if (activeAlternativeMarker) map.removeLayer(activeAlternativeMarker);
                
                const altIcon = L.divIcon({
                    className: '',
                    html: `<div class="alt-pin"><div>★</div></div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 32]
                });
                activeAlternativeMarker = L.marker(newCoords, { icon: altIcon }).addTo(map);
            }
        }

        window.fitItinerary = function() {
            const currentList = getCurrentItinerary();
            if (map && currentList && currentList.length > 0) {
                const coords = currentList.map(p => p.coords).filter(c => c && c.length === 2);
                if (coords.length > 0) {
                    map.fitBounds(coords, { padding: [50, 50], maxZoom: 15 });
                }
            }
        };

        function centerMapOnLocation(coords, zoomLevel = TARGET_ZOOM) {
            if (!map) return;

            if (window.innerWidth < 768) {
                const targetPoint = map.project(coords, zoomLevel);
                const offsetY = 120; // Décalage adapté pour la nouvelle bulle discrète
                const offsetPoint = L.point(targetPoint.x, targetPoint.y + offsetY);
                const offsetLatLng = map.unproject(offsetPoint, zoomLevel);
                map.flyTo(offsetLatLng, zoomLevel);
            } else {
                map.flyTo(coords, zoomLevel);
            }
        }

        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            if (window.innerWidth >= 768) return;
            
            if (!document.getElementById('viewer-panel').classList.contains('hidden') || 
                !document.getElementById('edit-panel').classList.contains('hidden')) {
                return;
            }

            const mapContainer = document.getElementById('map-container');
            if (!mapContainer.classList.contains('hidden')) {
                return;
            }

            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 80) {
                if (diffX > 0) {
                    switchMobileTab('list');
                } else {
                    switchMobileTab('map');
                }
            }
        }, { passive: true });

            toast.className = `toast px-5 py-3 rounded-2xl shadow-xl font-bold text-xs tracking-wide flex items-center gap-2 max-w-sm whitespace-nowrap ${colors[type] || colors.info}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity', 'duration-500');

                    }
                } else {
                    sidebar.style.removeProperty('width');
                    sidebar.style.removeProperty('min-width');
                    if (sidebar.classList.contains('hidden') && mapContainer.classList.contains('hidden')) {
                        switchMobileTab('list');
                    }
                }
            });

            if (window.innerWidth >= 768) {
                document.getElementById('map-container').classList.remove('hidden');
                document.getElementById('map-container').classList.add('flex');
                document.getElementById('sidebar-wrapper').classList.remove('hidden');
                document.getElementById('sidebar-wrapper').classList.add('flex');
            } else {
                switchMobileTab('list');
            }
        }

        window.onload = onStart;
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker enregistré avec succès !', reg))
            .catch(err => console.warn('Erreur d\'enregistrement du Service Worker', err));
        });
      }
    </script>
</body>
</html>
